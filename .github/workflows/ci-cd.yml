name: Pipeline CI/CD Multi-Environnements

on:
  # 1. Déclencheur : Tests automatiques sur CHAQUE push de n'importe quelle branche
  push:
    branches:
      - '**'
  # 2. Déclencheur : Validation sur la Pull Request vers les branches clés
  pull_request:
    branches:
      - main
      - staging

jobs:
  # -------------------------------------------------------------
  # EXIGENCE 1 : Tests automatiques à chaque commit / push
  # -------------------------------------------------------------
  test-and-lint:
    name: "Qualité & Tests Unitaires"
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-ssh-passphrase: false
          ssh-passphrase: ${{ secrets.SSH_PASSPHRASE }}

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; 
          pip install pytest flake8

      - name: Contrôle de la qualité du code (Linter)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Exécuter la suite de tests
        run: pytest tests/

  # -------------------------------------------------------------
  # EXIGENCE 2 : Gestion de l'environnement STAGING (Branche staging)
  # -------------------------------------------------------------
  deploy-staging:
    name: "Déploiement Staging"
    needs: test-and-lint
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.votre-app.com
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déployer en Staging
        run: |
          echo "Déploiement sur l'environnement de Pré-production..."
          # Vos commandes de déploiement (Docker, SSH, Cloud, etc.)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # -------------------------------------------------------------
  # EXIGENCE 3 : Gestion de l'environnement PRODUCTION (Branche main)
  # -------------------------------------------------------------
  deploy-production:
    name: "Déploiement Production"
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://github.com/nadjime-abdillahi/modele_machine-learning.git
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déployer en Production
        run: |
          echo "Déploiement sur l'environnement de Production..."
          # Vos commandes de déploiement
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}